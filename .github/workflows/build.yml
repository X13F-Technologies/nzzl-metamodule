name: Build NZZL plugin

# Builds every branch, not just main: the ARM cross-compile is the only way to
# verify a change actually works on hardware, and that needs to happen BEFORE
# a branch is merged, not after.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Install ARM GNU Toolchain 12.3
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.3.Rel1'

      - name: Install CMake 3.26
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Native test harness
        run: ./tests/run_tests.sh

      - name: Build
        run: |
          mkdir -p metamodule-plugins
          cmake -B build -G Ninja \
            -DINSTALL_DIR=${{ github.workspace }}/metamodule-plugins
          cmake --build build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v5
        with:
          name: NZZL-plugin
          path: metamodule-plugins/*.mmplugin
          if-no-files-found: error
